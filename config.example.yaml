# Chat Service Configuration
#
# Environment variables are expanded: $VAR or ${VAR}

llm:
  provider: anthropic                # "openai", "anthropic", "bedrock", "custom", "llm-proxy"
  endpoint: https://api.anthropic.com
  api_key: $ANTHROPIC_API_KEY
  model: claude-sonnet-4-20250514

mcp_servers:
  - name: harvest-mcp
    url: http://localhost:8082
    capability: harvest
  - name: ontap-mcp
    url: http://localhost:8083
    capability: ontap
    # Optional human-readable label and one-line description for this server's
    # capability/group, shown in the tool-routing group menu when
    # tool_routing.mode is "in-band" (see below). When omitted the capability
    # ID is used as the label and the description is auto-derived from the
    # server's tool names. Operator config only — never product/view semantics.
    # capability_name: ONTAP
    # capability_description: ONTAP cluster/volume management and stats
    # Optional allowlist of tool names to treat as read-only when the MCP
    # server does not publish ToolAnnotations.ReadOnlyHint. Tools listed here
    # survive read-only mode filtering; everything else from this server is
    # treated as write-capable and excluded in read-only mode.
    # read_only_tools:
    #   - list_volumes
    #   - get_volume_stats
    # Optional allowlist of inbound HTTP header names to relay from the current
    # chat request onto outbound requests to this server. Values are opaque to
    # the chat-service; the host application (and the server/proxy it talks to)
    # define and interpret them. Use this for per-request authorization, e.g. a
    # host-minted identity token forwarded through a trusted reverse proxy.
    # forward_headers:
    #   - X-User-Token

capabilities:
  defaults:
    harvest: allow
    ontap: ask

interests:
  dirs:
    - ./interests

# Product identity injected into the system prompt by the host application.
# These values are examples — set them to your own product's name/description.
product:
  name: Example Assistant
  description: An assistant for the host application that embeds this service
  guidelines:
    - Prefer read-only operations unless the user explicitly requests changes
    - Confirm destructive operations before executing them

server:
  addr: ":8090"

# Chat UI hint. The UI ships as the @edjbarron/netapp-chat-component React package;
# the standalone binary does not bundle a UI. Hosts that embed a prebuilt UI dist
# (via server.ServeUI) can use this flag to gate it.
# ui:
#   enabled: true

# Tool routing (S7a in-band supervisor) — strategies for keeping the per-turn
# tool list small as the number of connected MCP servers grows. See
# docs/high-tool-count-scaling.md. Omitting this block (or mode: off) is
# byte-for-byte identical to the legacy behavior: every enabled capability's
# tools are sent on every turn.
#
# tool_routing:
#   # off (default) | in-band | router
#   #   off:     no routing; all enabled tools sent every turn.
#   #   in-band: the model self-selects capability groups via an internal
#   #            load_tools tool before its tools are loaded (no extra LLM call).
#   #   router:  dedicated router model (S7b) — parsed but not yet implemented;
#   #            startup fails fast if selected.
#   mode: in-band
#   # Optional cap on the post-routing tool list (0 = no cap beyond the hard
#   # 128-tool provider limit).
#   max_tools: 0
#   # Capability/group IDs loaded from turn 1 without the model calling
#   # load_tools (a baseline that is always available).
#   always_on: []
#   # S8 intra-group selection: capability groups with more tools than this
#   # threshold are offered tool-by-tool in the routing menu, so the model can
#   # load a subset of a large server instead of the whole thing. 0 disables
#   # expansion (pure group-level routing).
#   group_expand_threshold: 0
